version: '3.8'

services:
  jdownloader-webui:
    build: .
    container_name: jdownloader-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - JD_URL=${JD_URL:-http://172.17.0.2:3128}
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      - /mnt/nas/dateien:/output
      - /opt/jdownloader-webui/app.py:/app/app.py
      - /opt/jdownloader-webui/static:/app/static
    env_file:
      - .env